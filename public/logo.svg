    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="17" fill="url(#qBg2)"/>

  <!-- sheet, tilted a touch so it reads as paper rather than a card -->
  <g transform="rotate(-4 32 33)">
    <path d="M17 15.5A3.5 3.5 0 0 1 20.5 12H38l9 9v27.5a3.5 3.5 0 0 1-3.5 3.5h-23a3.5 3.5 0 0 1-3.5-3.5z" fill="#FFFFFF"/>
    <path d="M38 12l9 9h-6.5A2.5 2.5 0 0 1 38 18.5z" fill="url(#qFold)"/>

    <!-- the two dots of ق, sitting where a question number would -->
    <circle cx="24.5" cy="27" r="2.1" fill="#2B6640"/>
    <circle cx="31.5" cy="27" r="2.1" fill="#2B6640"/>

    <rect x="22.5" y="34" width="19" height="2.6" rx="1.3" fill="#2B6640" opacity="0.9"/>
    <rect x="22.5" y="40" width="14" height="2.6" rx="1.3" fill="#4DB673" opacity="0.72"/>
    <rect x="22.5" y="46" width="9" height="2.6" rx="1.3" fill="#4DB673" opacity="0.45"/>
  </g>
