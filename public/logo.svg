<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="قرطاس">
  <defs>
    <linearGradient id="qBg" x1="8" y1="2" x2="56" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4DB673"/>
      <stop offset="0.55" stop-color="#33835024"/>
      <stop offset="1" stop-color="#1E4A2D"/>
    </linearGradient>
    <linearGradient id="qBg2" x1="8" y1="2" x2="56" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#57C47E"/>
      <stop offset="0.52" stop-color="#2F7749"/>
      <stop offset="1" stop-color="#1B4429"/>
    </linearGradient>
    <linearGradient id="qFold" x1="40" y1="12" x2="50" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CFE9D9"/>
